name: Refresh certification schedules

on:
  workflow_dispatch:
    inputs:
      notify_all:
        description: "Notify search engines about every published certification URL"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-certification-schedules.yml"
      - "scripts/collect/**"
      - "scripts/normalize/**"
      - "scripts/notify/**"
      - "scripts/validate/**"
      - "scripts/shared/qnet-api.ts"
      - "scripts/shared/external-sources.ts"
  schedule:
    - cron: "15 20 * * 0"

permissions:
  contents: write

concurrency:
  group: refresh-certification-schedules
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OFFICIAL_API_KEY: ${{ secrets.OFFICIAL_API_KEY }}
      USE_CERTIFICATION_FIXTURE: "0"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:refresh
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Commit refreshed official data
        id: data_commit
        run: |
          if git diff --quiet -- data/sources/certifications; then
            echo "No certification data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources/certifications
          git commit -m "data: refresh Q-Net certification schedules"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Notify Google discovery and Naver IndexNow
        if: steps.data_commit.outputs.changed == 'true' || inputs.notify_all == true || github.event_name == 'push'
        run: |
          if [[ "${{ inputs.notify_all }}" == "true" ]] || \
             git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | \
               grep -Eq '^(public/7f83157c808f500dec593857dc39b8fe.txt|.github/workflows/refresh-certification-schedules.yml)$'; then
            npm run search:notify -- --all
          else
            npm run search:notify -- --base-ref HEAD^
          fi
